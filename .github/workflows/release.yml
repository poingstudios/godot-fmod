name: Release Godot FMOD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  initialize:
    name: Determine Build Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup and Validation
        id: setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VERSION_TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION_TAG="${{ github.ref_name }}"
          else
            BASE_VERSION=$(grep "version=" platforms/godot_editor/addons/fmod/plugin.cfg | cut -d'"' -f2)
            VERSION_TAG="v${BASE_VERSION#v}"
          fi

          if gh api "repos/${{ github.repository }}/releases/tags/${VERSION_TAG}" > /dev/null 2>&1; then
            echo "::error::Release ${VERSION_TAG} already exists. Bump the version in plugin.cfg before releasing."
            exit 1
          fi

          echo "Release ${VERSION_TAG} does not exist. Proceeding with release build."
          echo "version=${VERSION_TAG}" >> $GITHUB_OUTPUT

  build-binaries:
    name: Build (${{ matrix.platform }}, ${{ matrix.arch }}, ${{ matrix.target }})
    needs: initialize
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-14
            platform: macos
            arch: arm64
            target: template_debug
          - os: macos-14
            platform: macos
            arch: arm64
            target: template_release
          - os: macos-14
            platform: macos
            arch: x86_64
            target: template_debug
          - os: macos-14
            platform: macos
            arch: x86_64
            target: template_release

          # Linux
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            target: template_debug
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            target: template_release

          # Windows
          - os: windows-2022
            platform: windows
            arch: x86_64
            target: template_debug
          - os: windows-2022
            platform: windows
            arch: x86_64
            target: template_release
          - os: windows-2022
            platform: windows
            arch: arm64
            target: template_debug
          - os: windows-2022
            platform: windows
            arch: arm64
            target: template_release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: python -m pip install scons

      - name: Set up MSVC (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: SCons Cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.scons-cache
          key: ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-scons-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-scons-${{ github.ref }}
            ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-scons-
            ${{ matrix.platform }}-${{ matrix.arch }}-scons-

      - name: Cache FMOD Engine SDK
        uses: actions/cache@v6
        id: cache-fmod-sdk
        with:
          path: platforms/gdextension/thirdparty/fmod
          key: fmod-sdk-${{ matrix.platform }}-${{ hashFiles('scripts/fetch_fmod_sdk.py') }}

      - name: Fetch FMOD Engine SDK
        if: steps.cache-fmod-sdk.outputs.cache-hit != 'true'
        env:
          FMOD_USER: ${{ secrets.FMOD_USER }}
          FMOD_PASSWORD: ${{ secrets.FMOD_PASSWORD }}
        run: |
          python3 scripts/fetch_fmod_sdk.py ${{ matrix.platform }}
        shell: bash

      - name: Compile GDExtension Binary
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
          SCONS_CACHE_LIMIT: 4096
        run: |
          scons -C platforms/gdextension platform=${{ matrix.platform }} target=${{ matrix.target }} arch=${{ matrix.arch }}
        shell: bash

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}
          path: platforms/godot_editor/addons/fmod/bin/*

  create-release:
    name: Package & Create Release
    needs: [initialize, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare Plugin Directory
        run: |
          mkdir -p platforms/godot_editor/addons/fmod/bin
          touch platforms/godot_editor/addons/fmod/bin/.gdignore

      - name: Download All Binaries
        uses: actions/download-artifact@v7
        with:
          pattern: binary-*
          merge-multiple: true
          path: platforms/godot_editor/addons/fmod/bin

      - name: Verify Binary Files
        run: |
          echo ">>> Binaries received:"
          ls -la platforms/godot_editor/addons/fmod/bin

      - name: Create Release Zip Package
        run: ./.github/scripts/compress_editor_plugin.sh

      - name: Upload Release Archive Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: platforms/godot_editor/${{ env.ZIP_NAME }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.initialize.outputs.version }}
          ZIP_NAME: ${{ env.ZIP_NAME }}
        run: |
          gh release create "$TAG" "platforms/godot_editor/$ZIP_NAME" \
            --title "$TAG" \
            --generate-notes \
            --latest
