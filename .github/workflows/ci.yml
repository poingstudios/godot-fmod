name: CI - Build Verification

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  build-test:
    name: Test Build (${{ matrix.platform }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
            arch: arm64
            target: template_debug
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            target: template_debug
          - os: windows-2022
            platform: windows
            arch: x86_64
            target: template_debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install SCons
        run: python -m pip install scons

      - name: Set up MSVC (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: SCons Cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.scons-cache
          key: ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-scons-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-scons-${{ github.ref }}
            ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-scons-
            ${{ matrix.platform }}-${{ matrix.arch }}-scons-

      - name: Cache FMOD Engine SDK
        uses: actions/cache@v6
        id: cache-fmod-sdk
        with:
          path: platforms/gdextension/thirdparty/fmod
          key: fmod-sdk-${{ matrix.platform }}-${{ hashFiles('scripts/fetch_fmod_sdk.py') }}

      - name: Fetch FMOD Engine SDK
        if: steps.cache-fmod-sdk.outputs.cache-hit != 'true'
        env:
          FMOD_USER: ${{ secrets.FMOD_USER }}
          FMOD_PASSWORD: ${{ secrets.FMOD_PASSWORD }}
        run: |
          python3 scripts/fetch_fmod_sdk.py ${{ matrix.platform }}
        shell: bash

      - name: Compile GDExtension Binary
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
          SCONS_CACHE_LIMIT: 4096
        run: |
          scons -C platforms/gdextension platform=${{ matrix.platform }} target=${{ matrix.target }} arch=${{ matrix.arch }}

  gdlint:
    name: "Lint: GDScript"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install gdlint
        run: |
          python -m pip install --upgrade pip
          pip install gdtoolkit

      - name: Run gdlint
        run: |
          gdlint platforms/godot_editor/addons/
